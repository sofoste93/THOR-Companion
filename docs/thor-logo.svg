<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">THOR Companion</title>
  <desc id="desc">A blue orbit surrounding the THOR lightning monogram.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#123c5e"/>
      <stop offset="1" stop-color="#06101b"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2fcff"/>
      <stop offset=".45" stop-color="#55e8ff"/>
      <stop offset="1" stop-color="#1689d5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="240" rx="30" fill="url(#space)"/>
  <g transform="translate(48 26)">
    <circle cx="94" cy="94" r="76" fill="#081b2b" stroke="#2bd9ff" stroke-width="3"/>
    <ellipse cx="94" cy="94" rx="92" ry="34" fill="none" stroke="#4de7ff" stroke-width="3" transform="rotate(-18 94 94)" opacity=".75"/>
    <circle cx="178" cy="63" r="7" fill="#8cf2ff" filter="url(#glow)"/>
    <path d="M105 29 57 105h35l-12 57 52-82H98z" fill="url(#bolt)" filter="url(#glow)"/>
  </g>
  <text x="250" y="112" fill="#f4fbff" font-family="Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="12">THOR</text>
  <text x="254" y="154" fill="#66dff6" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="7">COMPANION</text>
  <text x="256" y="190" fill="#6c91a6" font-family="Consolas,monospace" font-size="13" letter-spacing="2">FIRST SIGNAL · LOCAL MODE</text>
</svg>
